sensor:
  - platform: wifi_signal
    name: "WiFi 信号强度 Signal"
    id: wifi_rssi
    update_interval: 5min

  - platform: template
    name: "P1今日浇水时长 Today"
    id: today_seconds_1
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "P2今日浇水时长 Today"
    id: today_seconds_2
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "P3今日浇水时长 Today"
    id: today_seconds_3
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    accuracy_decimals: 0
