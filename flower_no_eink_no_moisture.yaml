#LINK: https://github.com/NoQuarrel/Flower_Waterer_ESPHome
#VERSION: 1.2
esphome:
  name: flower
  on_boot:
    priority: -100
    then:
      - script.execute: watering_schedule_validate
      - text_sensor.template.publish:
          id: watered_1
          state: !lambda |-
            return id(last_watered_1);
      - text_sensor.template.publish:
          id: watered_2
          state: !lambda |-
            return id(last_watered_2);
      - text_sensor.template.publish:
          id: watered_3
          state: !lambda |-
            return id(last_watered_3);
      - text_sensor.template.publish:
          id: watered_4
          state: !lambda |-
            return id(last_watered_4);
      - sensor.template.publish:
          id: today_seconds_1
          state: !lambda "return (float)id(today_watered_seconds_1);"
      - sensor.template.publish:
          id: today_seconds_2
          state: !lambda "return (float)id(today_watered_seconds_2);"
      - sensor.template.publish:
          id: today_seconds_3
          state: !lambda "return (float)id(today_watered_seconds_3);"
      - sensor.template.publish:
          id: today_seconds_4
          state: !lambda "return (float)id(today_watered_seconds_4);"
      - sensor.template.publish:
          id: predicted_tank_level
          state: !lambda |-
            if (id(tank_empty).state) {
              return 0.0f;
            }
            if (id(tank_full_override)) {
              return 100.0f;
            }
            return (float)id(tank_water_level);

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger: 

api:
  encryption:
    key: !secret flower_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret flower_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Flower Fallback Hotspot"
    password: !secret flower_ap_password
  reboot_timeout: 0s

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: "CST-8"
    on_time:
      - seconds: 0
        then:
          - script.execute: watering_schedule_check
      - hours: 0-23
        minutes: 0
        seconds: 0
        then:
          - lambda: |-
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return; 
              std::string today = now.strftime("%Y-%m-%d");
              if (id(today_date) != today) {
                id(today_date) = today;
                id(today_watered_seconds_1) = 0;
                id(today_watered_seconds_2) = 0;
                id(today_watered_seconds_3) = 0;
                id(today_watered_seconds_4) = 0;
                id(today_seconds_1).publish_state(0);
                id(today_seconds_2).publish_state(0);
                id(today_seconds_3).publish_state(0);
                id(today_seconds_4).publish_state(0);
              }

globals:
  - id: last_watering_schedule_fire
    type: std::string
    restore_value: yes
    max_restore_data_length: 24
    initial_value: "\"\""
  - id: watering_schedule_mask
    type: int
    restore_value: no
    initial_value: "15"
  - id: watering_schedule_error
    type: std::string
    restore_value: no
    initial_value: "\"\""
  - id: tank_water_level
    type: float
    restore_value: yes
    initial_value: "100"
  - id: tank_full_override
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: tank_total_used_percent
    type: float
    restore_value: yes
    initial_value: "0"
  - id: tank_usage_scale
    type: float
    restore_value: yes
  - id: tank_total_calibrated
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: tank_last_calibrated_percent
    type: float
    restore_value: yes
    initial_value: "100"
  - id: last_watered_1
    type: std::string
    restore_value: yes
    max_restore_data_length: 16
    initial_value: "\"无记录\""
  - id: last_watered_2
    type: std::string
    restore_value: yes
    max_restore_data_length: 16
    initial_value: "\"无记录\""
  - id: last_watered_3
    type: std::string
    restore_value: yes
    max_restore_data_length: 16
    initial_value: "\"无记录\""
  - id: last_watered_4
    type: std::string
    restore_value: yes
    max_restore_data_length: 16
    initial_value: "\"无记录\""
  - id: watering_by_script
    type: bool
    restore_value: no
    initial_value: "false"
  - id: pump_run_ticks_1
    type: int
    restore_value: no
    initial_value: "0"
  - id: pump_run_ticks_2
    type: int
    restore_value: no
    initial_value: "0"
  - id: pump_run_ticks_3
    type: int
    restore_value: no
    initial_value: "0"
  - id: pump_run_ticks_4
    type: int
    restore_value: no
    initial_value: "0"
  - id: pump_start_ms_1
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: pump_start_ms_2
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: pump_start_ms_3
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: pump_start_ms_4
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: today_watered_seconds_1
    type: int
    restore_value: yes
    initial_value: "0"
  - id: today_watered_seconds_2
    type: int
    restore_value: yes
    initial_value: "0"
  - id: today_watered_seconds_3
    type: int
    restore_value: yes
    initial_value: "0"
  - id: today_watered_seconds_4
    type: int
    restore_value: yes
    initial_value: "0"
  - id: today_date
    type: std::string
    restore_value: yes
    max_restore_data_length: 16
    initial_value: "\"\""

select:
