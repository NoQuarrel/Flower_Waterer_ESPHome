    icon: "mdi:clock-outline"
    mode: text
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: watering_schedule_validate

switch:
  - platform: template
    name: "忽略缺水"
    id: ignore_water_check
    icon: "mdi:water-pump"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

output:
  - platform: ledc
    #需熔断保险
    pin: 11
    frequency: 1000 Hz
    id: pump_1_output

  - platform: ledc
    pin: 18
    frequency: 1000 Hz
    id: pump_2_output

  - platform: ledc
    pin:
      number: 13
      ignore_pin_validation_error: true
    frequency: 1000 Hz
    id: pump_3_output

  - platform: ledc
    pin:
      number: 12
      ignore_pin_validation_error: true
    frequency: 1000 Hz
    id: pump_4_output

# ==========================================
# 水泵控制
# ==========================================
light:
  - platform: monochromatic
    output: pump_1_output
    name: "水泵1"
    icon: "mdi:water-pump"
    id: pump_1
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      then:
        - lambda: |-
            uint32_t now = millis();
            uint32_t start = id(pump_start_ms_1);
            if (start != 0 && now >= start) {
              float seconds = (now - start) / 1000.0f;
              float raw_used = seconds * (id(watering_percent_1).state / 100.0f);
              float used = raw_used * id(tank_usage_scale);
              id(tank_total_used_percent) += used;
              id(tank_water_level) = std::max(0.0f, 100.0f - id(tank_total_used_percent));
              if (id(tank_empty).state) {
                id(tank_water_level) = 0.0f;
              } else if (id(tank_water_level) <= 0.0f) {
                id(tank_water_level) = 1.0f;
              }
              if (used > 0.0f) id(tank_full_override) = false;
              id(pump_start_ms_1) = 0;
              ESP_LOGI("pump_1_calc", "start=%u now=%u seconds=%.2f power=%d%% raw_used=%.2f used=%.2f scale=%.6f total_used=%.2f water_level=%.2f",
                       start, now, seconds, (int)id(watering_percent_1).state,
                       raw_used, used, id(tank_usage_scale), id(tank_total_used_percent), id(tank_water_level));
            }
        - component.update: predicted_tank_level
    on_turn_on:
      then:
        - if:
            condition:
              or:
                - lambda: |-
                    return !id(tank_empty).state;
                - lambda: |-
                    return id(ignore_water_check).state;
            then:
              - if:
                  condition:
                    time.has_time:
                  then:
                    - text_sensor.template.publish:
                        id: watered_1
                        state: !lambda |-
                          auto stamp = id(sntp_time).now().strftime("%m-%d %H:%M");
                          id(last_watered_1) = stamp;
                          return stamp;
                    - lambda: |-
                        id(pump_start_ms_1) = millis();
                    - if:
                        condition:
                          lambda: |-
                            return !id(watering_by_script);
                        then:
                          - lambda: |-
                              id(pump_run_ticks_1) = (int)(id(watering_seconds_1).state * 10);
                          - while:
                              condition:
                                lambda: |-
                                  return id(pump_run_ticks_1) > 0 &&
                                         (!id(tank_empty).state || id(ignore_water_check).state);
                              then:
                                - delay: 100ms
                                - lambda: |-
                                    id(pump_run_ticks_1)--;
                          - light.turn_off: pump_1
            else:
              - light.turn_off: pump_1

  - platform: monochromatic
    output: pump_2_output
    name: "水泵2"
