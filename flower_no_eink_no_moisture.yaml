    lambda: |-
      if (!id(tank_total_calibrated)) return 100.0f;
      if (id(tank_empty).state) return 0.0f;
      if (id(tank_full_override)) return 100.0f;
      float level = id(tank_water_level);
      if (level <= 0.0f) level = 1.0f;
      return level;

binary_sensor:
  - platform: gpio
    pin:
      number: 20
      mode: INPUT_PULLUP
      inverted: true
    name: "水箱缺水"
    icon: "mdi:water"
    id: tank_empty
    on_state:
      then:
        - lambda: |-
            if (id(tank_empty).state) {
              id(tank_last_calibrated_percent) = 0.0f;
              id(tank_full_override) = false;
              if (!id(tank_total_calibrated) && id(tank_total_used_percent) > 0.0f) {
                id(tank_usage_scale) = 100.0f / id(tank_total_used_percent);
                id(tank_total_calibrated) = true;
                ESP_LOGI("tank_calib", "水箱标定完成: total_used=%.2f scale=%.6f",
                         id(tank_total_used_percent), id(tank_usage_scale));
              }
            } else {
              id(tank_total_used_percent) = 0.0f;
              id(tank_water_level) = 100.0f;
              id(tank_full_override) = true;
              id(tank_last_calibrated_percent) = 100.0f;
            }
        - component.update: predicted_tank_level

